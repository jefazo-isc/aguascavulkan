name: Reporte de bug
description: Algo no funciona como debería
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: observado
    attributes:
      label: Qué pasa
      description: Comportamiento observado (incluye capturas o mensajes de la consola del navegador).
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué debería pasar
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      value: |
        1. Abrir http://localhost:8080/web/ (o la demo en GitHub Pages)
        2.
        3.
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Navegador y backend
      description: Ej. Chrome 142 / WebGPU, Firefox 145 / WebGL2 (se ve en el HUD).
