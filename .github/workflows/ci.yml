name: StreetVulkan CI (DevOps & Quality Gate)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      CCACHE_DIR: ~/.ccache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Python dependencies (NumPy, Pillow)
        run: |
          pip install -r requirements.txt

      - name: Restore APT packages cache
        uses: actions/cache@v5
        id: apt-cache
        with:
          path: ~/.cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install Vulkan, SDL2 and build tools
        run: |
          sudo tee /etc/apt/apt.conf.d/01keep-debs <<'EOF'
          APT::Keep-Downloaded-Packages "true";
          Binary::apt::APT::Keep-Downloaded-Packages "true";
          EOF
          sudo mkdir -p /var/cache/apt/archives
          if [ -d "$HOME/.cache/apt/archives" ] && ls "$HOME/.cache/apt/archives"/*.deb >/dev/null 2>&1; then
            echo "Restoring cached deb packages to apt..."
            sudo cp -n "$HOME/.cache/apt/archives"/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fi
          if ! sudo apt-get install -y --no-install-recommends libsdl2-dev libvulkan-dev glslang-tools ccache; then
            echo "Cache miss or dependencies need update: updating apt repositories..."
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              libsdl2-dev \
              libvulkan-dev \
              glslang-tools \
              ccache
          fi
          mkdir -p "$HOME/.cache/apt/archives"
          cp -n /var/cache/apt/archives/*.deb "$HOME/.cache/apt/archives/" 2>/dev/null || true

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-
          max-size: 500M
          create-symlink: true

      - name: Build Web-First client and legacy shaders/engine
        run: |
          make -j$(nproc) web-build
          make -j$(nproc) legacy-native

      - name: Run XP unit tests (C, ASan/UBSan & Python)
        run: |
          make -j$(nproc) test
          make -j$(nproc) asan-test

      - name: Verify reproducible WebAssembly build (.wat -> .wasm)
        run: |
          python3 tools/compile_wat_to_wasm.py web/street_vulkan_core.wat /tmp/ci_core.wasm
          cmp -s web/street_vulkan_core.wasm /tmp/ci_core.wasm
          rm -f /tmp/ci_core.wasm

      - name: Run ISO/IEC 25040/25023/19761/29110/27001/29119/9001 checks
        run: |
          python3 tools/metrics/estimate_cocomo_fp.py
          python3 tools/metrics/measure_iso25023.py
          rc=0; python3 tools/metrics/measure_maintainability.py || rc=$?; test "$rc" -eq 0 -o "$rc" -eq 2
          python3 tools/metrics/check_traceability.py
          python3 tools/metrics/audit_iso27001_27034.py
          python3 tools/metrics/audit_iso29119.py
          python3 tools/metrics/audit_iso9001_31000.py
