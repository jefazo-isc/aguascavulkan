name: StreetVulkan WASM & WebGPU Pages

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/ci.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Rebuild WebAssembly core from WAT
        run: |
          python3 tools/compile_wat_to_wasm.py web/street_vulkan_core.wat web/street_vulkan_core.wasm
          python3 -c 'import pathlib; data = pathlib.Path("web/street_vulkan_core.wasm").read_bytes(); assert data[:8] == b"\x00asm\x01\x00\x00\x00", "Invalid WASM header"'

      - name: Assemble GitHub Pages showcase bundle
        run: |
          rm -rf _site
          mkdir -p _site/web _site/models/sectors _site/models/cars _site/assets
          cp -r web/. _site/web/
          for f in \
            models/texture_atlas_16x16.png \
            models/traffic_signals.json \
            models/rolcar_aguascalientes.json \
            models/utility_poles_rolcar.json \
            models/road_network.bin \
            models/city_basemap.bin; do
            if [ -f "$f" ]; then cp "$f" _site/models/; fi
          done
          if [ -d models/cars ]; then
            cp -r models/cars/. _site/models/cars/
          fi
          for f in \
            assets/texture_atlas_16x16.png \
            assets/rolcar_anuncio.png \
            assets/rolcar_fachada.png \
            assets/rolcar_logo_banner.png \
            assets/rolcar_logo_oval.png \
            assets/rolcar_marquesina.png; do
            if [ -f "$f" ]; then cp "$f" _site/assets/; fi
          done
          # Package sector_0_0.glb and generated key Tercer Anillo sectors strictly < 95 MB
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import shutil

          MAX_BYTES = 95 * 1024 * 1024
          site_sectors_dir = pathlib.Path("_site/models/sectors")
          site_sectors_dir.mkdir(parents=True, exist_ok=True)

          # Complete Tercer Anillo perimeter and area corridor coords (Av. Siglo XXI, underpasses, overpasses)
          KEY_TERCER_ANILLO_COORDS = {
              (-8, -5), (-8, -4), (-8, -3), (-8, -2), (-8, -1), (-8, 0), (-8, 1), (-8, 2),
              (-7, -8), (-7, -7), (-7, -6), (-7, -5), (-7, -4), (-7, -3), (-7, -2), (-7, -1),
              (-7, 0), (-7, 1), (-7, 2), (-6, -8), (-6, -7), (-6, -6), (-6, -5), (-6, -4),
              (-6, -3), (-6, -2), (-6, -1), (-6, 0), (-6, 1), (-6, 2), (-6, 3), (-5, -8),
              (-5, -7), (-5, -6), (-5, -5), (-5, -4), (-5, -3), (-5, -2), (-5, -1), (-5, 0),
              (-5, 1), (-5, 2), (-5, 3), (-5, 8), (-4, -8), (-4, -7), (-4, -6), (-4, -5),
              (-4, -4), (-4, -3), (-4, -2), (-4, -1), (-4, 0), (-4, 1), (-4, 2), (-4, 3),
              (-4, 4), (-3, -8), (-3, -7), (-3, -6), (-3, -5), (-3, -4), (-3, -3), (-3, -2),
              (-3, -1), (-3, 0), (-3, 1), (-3, 2), (-3, 3), (-3, 4), (-2, -8), (-2, -7),
              (-2, -6), (-2, -5), (-2, -4), (-2, -3), (-2, -2), (-2, -1), (-2, 0), (-2, 1),
              (-2, 2), (-2, 3), (-2, 4), (-1, -8), (-1, -7), (-1, -6), (-1, -5), (-1, -4),
              (-1, -3), (-1, -2), (-1, -1), (-1, 0), (-1, 1), (-1, 2), (-1, 3), (-1, 4),
              (0, -8), (0, -7), (0, -6), (0, -5), (0, -4), (0, -3), (0, -2), (0, -1),
              (0, 0), (0, 1), (0, 2), (0, 3), (1, -7), (1, -6), (1, -5), (1, -4),
              (1, -3), (1, -2), (1, -1), (1, 0), (1, 1), (1, 2), (1, 3), (2, -7),
              (2, -6), (2, -5), (2, -4), (2, -3), (2, -2), (2, -1), (2, 0), (2, 1),
              (2, 2), (2, 3), (3, -6), (3, -5), (3, -4), (3, -3), (3, -2), (3, -1),
              (3, 0), (3, 1), (3, 2), (3, 3), (4, -4), (4, -3), (4, -2), (4, -1),
              (4, 0), (4, 1), (4, 2), (5, 0), (5, 1)
          }

          # Primer Anillo (Av. Convención de 1914, Centro Histórico) — 32 sectors within 2300m radius
          KEY_PRIMER_ANILLO_COORDS = {
              (-3, -2), (-3, -1), (-3, 0), (-3, 1),
              (-2, -3), (-2, -2), (-2, -1), (-2, 0), (-2, 1), (-2, 2),
              (-1, -3), (-1, -2), (-1, -1), (-1, 0), (-1, 1), (-1, 2),
              (0, -3), (0, -2), (0, -1), (0, 0), (0, 1), (0, 2),
              (1, -3), (1, -2), (1, -1), (1, 0), (1, 1), (1, 2),
              (2, -2), (2, -1), (2, 0), (2, 1)
          }

          # Union of all ring sectors for packaging
          ALL_KEY_COORDS = KEY_TERCER_ANILLO_COORDS | KEY_PRIMER_ANILLO_COORDS

          # Package sector_0_0.glb and its chunks unconditionally if present
          for f in ("sector_0_0.glb", "chunks_0_0.json"):
              p = pathlib.Path("models/sectors") / f
              if p.is_file() and p.stat().st_size < MAX_BYTES:
                  shutil.copy2(p, site_sectors_dir / f)

          manifest_path = pathlib.Path("models/sectors.json")
          if manifest_path.is_file():
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              packaged = []
              seen_coords = set()
              for s in manifest.get("sectors", []):
                  if not isinstance(s, dict) or "mx" not in s or "mz" not in s:
                      continue
                  mx, mz = int(s["mx"]), int(s["mz"])
                  if (mx, mz) in seen_coords:
                      continue
                  glb_file = pathlib.Path("models/sectors") / f"sector_{mx}_{mz}.glb"
                  chunk_file = pathlib.Path("models/sectors") / f"chunks_{mx}_{mz}.json"
                  is_key = (mx, mz) in ALL_KEY_COORDS or (mx == 0 and mz == 0)
                  if is_key and glb_file.is_file() and glb_file.stat().st_size < MAX_BYTES:
                      shutil.copy2(glb_file, site_sectors_dir / glb_file.name)
                      if chunk_file.is_file() and chunk_file.stat().st_size < MAX_BYTES:
                          shutil.copy2(chunk_file, site_sectors_dir / chunk_file.name)
                      packaged.append(s)
                      seen_coords.add((mx, mz))

              out_manifest = {
                  **manifest,
                  "sector_count": len(packaged),
                  "total_verts": sum(int(s.get("vert_count", 0)) for s in packaged),
                  "sectors": packaged,
              }
              pathlib.Path("_site/models/sectors.json").write_text(
                  json.dumps(out_manifest, separators=(",", ":")),
                  encoding="utf-8",
              )
              print(f"[wasm-pages] Empaquetados {len(packaged)} sectores clave (Primer + Tercer Anillo, < 95 MB) en _site/models/sectors/")

          for root, _, files in os.walk("_site"):
              for fname in files:
                  fpath = pathlib.Path(root) / fname
                  sz = fpath.stat().st_size
                  if sz >= MAX_BYTES:
                      raise RuntimeError(f"Packaged file exceeds 95 MiB limit: {fpath} ({sz} bytes)")
          PY
          if [ -f index.html ]; then
            cp index.html _site/index.html
          else
            cat <<'HTML' > _site/index.html
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8" />
            <meta http-equiv="refresh" content="0; url=./web/index.html" />
            <title>StreetVulkan Web — Aguascalientes WebAssembly + WebGPU</title>
            <script>window.location.replace("./web/index.html" + window.location.search + window.location.hash);</script>
          </head>
          <body>
            <p>Redirigiendo a <a href="./web/index.html">StreetVulkan Web</a>...</p>
          </body>
          </html>
          HTML
          fi
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
